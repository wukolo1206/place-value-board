<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>分解與合成</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;
     background:#f4f7fb;color:#1f2937;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back{text-decoration:none;color:#475569;font-size:15px;padding:6px 10px;border-radius:8px}
h1{font-size:20px;margin:0;flex:1}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;min-height:52px;font-size:19px;font-weight:700;border:2px solid #cbd5e1;
     background:#fff;color:#64748b;border-radius:12px;cursor:pointer}
.tab.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.panel{display:none}.panel.on{display:block}

.card{background:#fff;border-radius:12px;padding:16px;border:2px solid #e2e8f0;margin-bottom:12px}
.big{font-size:44px;font-weight:700;text-align:center;letter-spacing:3px;color:#0f172a;margin:8px 0}
.parts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.part{border-radius:10px;padding:10px 14px;font-size:19px;font-weight:700;
      border:2px solid #ddd6fe;background:#f5f3ff;color:#5b21b6;min-height:52px;
      display:flex;align-items:center;gap:6px;cursor:pointer;transition:transform .12s,opacity .15s}
.part:active{transform:scale(.97)}
.part.off{opacity:.25}
.part b{font-size:24px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{min-height:48px;padding:0 18px;font-size:17px;font-weight:700;border-radius:10px;
     border:2px solid #cbd5e1;background:#fff;color:#334155;cursor:pointer}
.btn.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.hint{font-size:15px;color:#64748b;text-align:center;margin-top:10px;line-height:1.6}
.slot{display:inline-block;min-width:64px;border-bottom:3px solid #7c3aed;
      font-size:26px;font-weight:700;text-align:center;color:#5b21b6}

/* ── 探索模式：數字卡片與定位板 ── */
.num-chips{display:flex;gap:10px;justify-content:center;margin:12px 0 16px;flex-wrap:wrap}
.dchip{min-width:54px;min-height:56px;padding:6px 14px;font-size:32px;font-weight:700;
       color:#fff;background:#7c3aed;border-radius:10px;cursor:grab;touch-action:none;
       user-select:none;display:flex;align-items:center;justify-content:center;
       box-shadow:0 3px 8px rgba(124,58,237,.3);border:2px solid rgba(255,255,255,.4);
       transition:transform .12s,opacity .15s,background .15s}
.dchip:active{transform:scale(.95);cursor:grabbing}
.dchip.placed{background:#cbd5e1;color:#64748b;box-shadow:none;border-color:#cbd5e1;cursor:default;opacity:.45}
.ghost-chip{position:fixed;pointer-events:none;z-index:999;opacity:.92;font-size:32px;
            font-weight:700;color:#fff;background:#7c3aed;border-radius:10px;
            padding:6px 18px;box-shadow:0 8px 22px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.exboard-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px auto;padding-bottom:4px}
table.exboard{border-collapse:separate;border-spacing:0;margin:0 auto;background:#fff;
              border:2.5px solid #1e3a8a;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(30,58,138,.08)}
table.exboard th,table.exboard td{border-right:1.5px solid #bfdbfe;text-align:center;min-width:68px}
table.exboard th:last-child,table.exboard td:last-child{border-right:none}
table.exboard th{background:#e0f2fe;color:#1e3a8a;font-size:16px;padding:10px 4px;font-weight:700}
table.exboard td{font-size:36px;font-weight:700;height:72px;color:#0f172a;cursor:pointer;
                 transition:background .15s,color .15s}
table.exboard td.empty{color:#cbd5e1;background:#fff;font-size:32px}
table.exboard td.filled{background:#fff;color:#1e3a8a}
table.exboard td.drop{background:#dcfce7 !important;color:#059669}
table.exboard td.bad{background:#fee2e2 !important;color:#dc2626}
table.exboard .grp{border-right:3.5px solid #1e3a8a !important}

/* ── 數字卡片與四位分組線 ── */
.num-chips{display:flex;gap:8px;justify-content:center;align-items:center;margin:12px 0 16px;flex-wrap:wrap}
.chip-divider{width:3.5px;height:52px;background:#1e3a8a;border-radius:2px;margin:0 4px;align-self:center}

/* ── 練習模式：合成題先放定位板 ── */
.qchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 14px}
.qchip{padding:8px 14px;font-size:18px;font-weight:700;background:#f5f3ff;color:#5b21b6;
       border:2px solid #ddd6fe;border-radius:10px;cursor:pointer;user-select:none;
       touch-action:none;transition:transform .12s,background .15s}
.qchip:active{transform:scale(.95)}
.qchip.placed{background:#e2e8f0;color:#94a3b8;border-color:#cbd5e1}
.qboard-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px auto 14px;padding-bottom:4px}
table.qboard{border-collapse:separate;border-spacing:0;margin:0 auto;background:#fff;
             border:2.5px solid #059669;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(5,150,105,.1)}
table.qboard th,table.qboard td{border-right:2px solid #a7f3d0;text-align:center;min-width:60px}
table.qboard th:last-child,table.qboard td:last-child{border-right:none}
table.qboard th{background:#ecfdf5;color:#065f46;font-size:15px;padding:6px 4px;font-weight:700}
table.qboard td{font-size:32px;font-weight:700;height:64px;color:#0f172a;cursor:pointer;
                transition:background .12s}
table.qboard td.empty{color:#cbd5e1;background:#f0fdf4}
table.qboard td.filled{background:#fff;color:#065f46}
table.qboard td.zero{color:#dc2626;background:#fff}
table.qboard td.drop{background:#bbf7d0 !important}
table.qboard td.bad{background:#fee2e2 !important}

.stagebar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.st{flex:1;min-width:96px;min-height:46px;font-size:15px;font-weight:700;border-radius:10px;
    border:2px solid #cbd5e1;background:#fff;color:#64748b;cursor:pointer}
.st.on{background:#059669;border-color:#059669;color:#fff}
.st.done{border-color:#059669;color:#059669}
.qtitle{font-size:17px;color:#475569;margin-bottom:10px}
.qbody{font-size:26px;font-weight:700;text-align:center;margin:14px 0;color:#0f172a;line-height:1.6}
.ans{width:100%;max-width:420px;min-height:56px;font-size:26px;text-align:center;
     border:2px solid #cbd5e1;border-radius:10px;display:block;margin:0 auto;
     font-family:inherit;font-weight:700}
.ans:focus{outline:none;border-color:#7c3aed}
.multi{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.mi{display:flex;align-items:center;gap:4px;font-size:19px;font-weight:700}
.mi input{width:76px;min-height:52px;font-size:24px;text-align:center;font-family:inherit;
          font-weight:700;border:2px solid #cbd5e1;border-radius:8px}
.mi input:focus{outline:none;border-color:#7c3aed}
.fb{text-align:center;font-size:19px;font-weight:700;margin-top:12px;min-height:30px}
.fb.ok{color:#059669}.fb.no{color:#dc2626}
.prog{text-align:center;font-size:15px;color:#64748b;margin-top:10px}
@media(min-width:900px){h1{font-size:24px}.big{font-size:60px}}

/* ── 挑戰（學力檢測考古題）── */
.chsrc{font-size:15px;color:#94a3b8;margin-bottom:6px}
.chnote{font-size:14px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;
        border-radius:8px;padding:8px 10px;margin:8px 0;line-height:1.6}
.chopt{display:block;width:100%;text-align:left;min-height:56px;margin:8px 0;padding:12px 16px;
       font-size:19px;font-weight:700;border:2px solid #cbd5e1;background:#fff;color:#334155;
       border-radius:10px;cursor:pointer;font-family:inherit;line-height:1.5}
.chopt:active{transform:scale(.99)}
.chopt.ok{background:#dcfce7;border-color:#059669;color:#065f46}
.chopt.no{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.chwhy{font-size:16px;color:#334155;background:#f1f5f9;border-radius:8px;
       padding:10px 12px;margin-top:10px;line-height:1.7;display:none}

/* ── 表徵重呈：答錯時把同一題換成定位板形式再呈現 ── */
.scaffold{background:#fffbeb;border:3px solid #f59e0b;border-radius:12px;
          padding:14px;margin-top:14px;display:none}
.scaffold.on{display:block}
.sctitle{font-size:17px;font-weight:700;color:#b45309;margin-bottom:4px}
.scsub{font-size:15px;color:#92400e;margin-bottom:10px;line-height:1.6}
.scwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.scb{border-collapse:separate;border-spacing:0;margin:0 auto;background:#fff;
          border:3px solid #b45309;border-radius:10px;overflow:hidden}
table.scb th,table.scb td{border-right:2px solid #fde68a;text-align:center;min-width:56px}
table.scb th:last-child,table.scb td:last-child{border-right:none}
table.scb th{background:#fef3c7;color:#92400e;font-size:14px;padding:5px 2px;font-weight:700}
table.scb td{font-size:32px;font-weight:700;height:64px;color:#0f172a;cursor:pointer}
table.scb td.empty{color:#fca5a5;background:#fef2f2}
table.scb td.filled{background:#dcfce7;color:#065f46}
.scmsg{text-align:center;font-size:17px;font-weight:700;margin-top:10px;min-height:26px;color:#b45309}
/* 觸控目標一律 ≥ 48px（教師大屏與學生 iPad）*/
.back{min-height:48px;display:inline-flex;align-items:center}
.st{min-height:48px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">← 返回</a>
    <h1>分解與合成</h1>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabEx" onclick="setMode('explore')">🔍 探索</button>
    <button class="tab" id="tabQz" onclick="setMode('quiz')">✏️ 練習</button>
    <button class="tab" id="tabCh" onclick="setMode('chal')">🏆 挑戰</button>
  </div>

  <!-- ═══ 探索 ═══ -->
  <div class="panel on" id="pEx">
    <div class="card">
      <div style="font-size:16px;font-weight:700;color:#64748b;text-align:center;margin-bottom:6px">
        ① 由右往左「四位一組」分組（請將數字<b>拖曳</b>或<b>點一下</b>放進定位板）：
      </div>
      <div class="big" id="eNum" style="margin:4px 0 8px">40980</div>
      <div id="eChips"></div>

      <div style="font-size:16px;font-weight:700;color:#5b21b6;text-align:center;margin:16px 0 6px">
        ② 定位板（表徵：位置決定位值）：
      </div>
      <div class="exboard-wrap"><table class="exboard" id="exBoard"></table></div>

      <div style="font-size:16px;font-weight:700;color:#64748b;text-align:center;margin:16px 0 6px">
        ③ 位值分解展開（點擊積木可拿掉/合成）：
      </div>
      <div class="parts" id="eParts"></div>
      <div class="hint" id="eHint">
        點一下任一塊，可以把它<b>拿掉</b>看看數字會變成多少 —— 這就是「分解」與「合成」。
      </div>
    </div>
    <div class="ctrl">
      <button class="btn" onclick="setSample(40980, false)">40980</button>
      <button class="btn" onclick="setSample(51957, false)">51957</button>
      <button class="btn" onclick="setSample(9490995, false)">9490995</button>
      <button class="btn" onclick="setSample(7008009, false)">7008009</button>
      <button class="btn" onclick="setSample(916212, false)">916212</button>
      <button class="btn on" onclick="randomSample()">換一個數</button>
      <button class="btn" onclick="fillAll()">⚡ 一鍵全放</button>
      <button class="btn" onclick="resetPractice()">🎯 重新拉數</button>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="hint" style="text-align:left">
        <b>看清楚同一個數字在不同位置代表多少</b><br>
        課本問：「51957 中的兩個 5，各表示多少？」<br>
        把數字放進定位板後，下方每一塊都寫著它<b>真正的值</b>，位置不同，值就差很多。
      </div>
    </div>
  </div>

  <!-- ═══ 練習 ═══ -->
  <div class="panel" id="pQz">
    <div class="stagebar">
      <button class="st on" id="s0" onclick="goStage(0)">一 分解</button>
      <button class="st" id="s1" onclick="goStage(1)">二 位值</button>
      <button class="st" id="s2" onclick="goStage(2)">三 合成</button>
      <button class="st" id="s3" onclick="goStage(3)">四 打亂</button>
      <button class="st" id="s4" onclick="goStage(4)">五 跳位</button>
    </div>
    <div class="card">
      <div class="qtitle" id="qTitle"></div>
      <div class="qbody" id="qBody"></div>
      <div id="qInput"></div>
      <div class="ctrl">
        <button class="btn on" onclick="checkAns()">確認</button>
        <button class="btn" onclick="nextQ()">下一題 →</button>
      </div>
      <div class="fb" id="qFb"></div>
      <div class="scaffold" id="scaf">
        <div class="sctitle">🔁 換個方式看：回到定位板放放看</div>
        <div class="scsub" id="scSub"></div>
        <div class="scwrap"><table class="scb" id="scTbl"></table></div>
        <div class="scmsg" id="scMsg"></div>
        <div class="ctrl">
          <button class="btn on" onclick="scaffoldDone()">我看懂了，再答一次</button>
        </div>
      </div>
      <div class="prog" id="qProg"></div>
    </div>
  </div>

  <!-- ═══ 挑戰 ═══ -->
  <div class="panel" id="pCh">
    <div style="background:#fff;border-radius:12px;padding:18px;border:2px solid #e2e8f0">
      <div class="chsrc" id="chSrc"></div>
      <div style="font-size:20px;font-weight:700;line-height:1.7;color:#0f172a" id="chStem"></div>
      <div class="chnote" id="chNote" style="display:none"></div>
      <div id="chOpts" style="margin-top:12px"></div>
      <div class="fb" id="chFb"></div>
      <div class="chwhy" id="chWhy"></div>
      <div class="ctrl"><button class="btn" onclick="nextChal()">下一題 →</button></div>
      <div class="prog" id="chProg"></div>
    </div>
  </div>
</div>


<script>
var UNIT = ['一','十','百','千','萬','十萬','百萬','千萬'];
var UNIT_NAMES = ['個位','十位','百位','千位','萬位','十萬位','百萬位','千萬位','億位'];

function setMode(m) {
  ['Ex','Qz','Ch'].forEach(function(k) {
    var on = (k === 'Ex' && m === 'explore') || (k === 'Qz' && m === 'quiz')
           || (k === 'Ch' && m === 'chal');
    var pn = document.getElementById('p' + k), tb = document.getElementById('tab' + k);
    if (pn) pn.className = 'panel' + (on ? ' on' : '');
    if (tb) tb.className = 'tab' + (on ? ' on' : '');
  });
  cancelPending();          // 切分頁時讓在途的練習區回呼失效
  if (m === 'chal') renderChal();
}

/* ═══ 探索：把數字拉到定位板 ➔ 展開位值分解 ═══ */
var curN = 40980, off = {}, placed = {};

function setSample(n, autoFill) {
  curN = n;
  off = {};
  placed = {};
  if (autoFill) {
    var s = String(curN), L = s.length;
    for (var i = 0; i < L; i++) placed[L - 1 - i] = true;
  }
  renderExplore();
}

function randomSample() {
  var len = 5 + Math.floor(Math.random() * 3), s = String(1 + Math.floor(Math.random() * 9));
  for (var i = 1; i < len; i++) s += String(Math.floor(Math.random() * 10));
  setSample(+s, false);
}

function fillAll() {
  var s = String(curN), L = s.length;
  for (var i = 0; i < L; i++) placed[L - 1 - i] = true;
  renderExplore();
}

function resetPractice() {
  placed = {};
  off = {};
  renderExplore();
}

function renderExplore() {
  drawChips();
  drawExBoard();
  drawParts();
}

function formatGroupedNumber(num) {
  var s = String(num), L = s.length;
  if (L <= 4) return s;
  return s.slice(0, L - 4) + ' ' + s.slice(L - 4);
}

function drawChips() {
  var s = String(curN), L = s.length, html = '';
  for (var i = 0; i < L; i++) {
    var d = s.charAt(i), pos = L - 1 - i;
    var isPl = !!placed[pos];
    html += '<div class="dchip' + (isPl ? ' placed' : '') + '" data-pos="' + pos + '" data-d="' + d + '">'
          + d + '</div>';
    // 在萬位和千位之間（即 pos === 4）畫分組間隔線
    if (pos === 4 && i < L - 1) {
      html += '<div class="chip-divider" title="四位分組線"></div>';
    }
  }
  document.getElementById('eChips').innerHTML = html;
  document.getElementById('eChips').className = 'num-chips';
  [].forEach.call(document.querySelectorAll('.dchip'), bindChip);
}

function bindChip(el) {
  var pos = +el.getAttribute('data-pos'), d = el.getAttribute('data-d');
  var ghost = null, moved = false;

  el.addEventListener('pointerdown', function(e) {
    if (placed[pos]) return;
    e.preventDefault();
    moved = false;
    el.setPointerCapture(e.pointerId);
    ghost = document.createElement('div');
    ghost.className = 'ghost-chip';
    ghost.textContent = d;
    document.body.appendChild(ghost);
    moveGhost(e);
  });

  el.addEventListener('pointermove', function(e) {
    if (!ghost) return;
    moved = true;
    moveGhost(e);
    highlightCellUnder(e, pos);
  });

  el.addEventListener('pointerup', function(e) {
    if (!ghost) return;
    ghost.remove(); ghost = null;
    clearExHi();

    if (!moved) {
      // 點一下 ＝ 自動放進它該去的位
      placeDigit(pos);
      return;
    }

    var targetPos = cellUnder(e);
    if (targetPos === null) return; // 拖到空白處取消
    if (targetPos !== pos) {
      flashCell(targetPos, 'bad');
      document.getElementById('eHint').innerHTML =
        '<b style="color:#dc2626">這個「' + d + '」是 ' + UNIT[pos] + ' 位的，要放在「' + UNIT[pos] + '」喔！</b>';
      return;
    }
    placeDigit(pos);
  });

  function moveGhost(e) {
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
  }
}

function placeDigit(pos) {
  placed[pos] = true;
  flashCell(pos, 'drop');
  renderExplore();
}

function cellUnder(e) {
  var el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el) return null;
  var target = el.closest ? el.closest('td[data-ex-pos]') : null;
  if (target && target.getAttribute('data-ex-pos') !== null) {
    return +target.getAttribute('data-ex-pos');
  }
  return null;
}

function highlightCellUnder(e, wantPos) {
  clearExHi();
  var p = cellUnder(e);
  if (p === null) return;
  var cell = document.getElementById('ec_' + p);
  if (cell) cell.classList.add(p === wantPos ? 'drop' : 'bad');
}

function clearExHi() {
  [].forEach.call(document.querySelectorAll('.exboard td'), function(c) {
    c.classList.remove('drop'); c.classList.remove('bad');
  });
}

function flashCell(pos, cls) {
  var el = document.getElementById('ec_' + pos);
  if (!el) return;
  el.classList.add(cls);
  setTimeout(function(){ el.classList.remove(cls); }, 450);
}

function drawExBoard() {
  var s = String(curN), L = s.length;
  var h = '<tr>', b = '<tr>';
  for (var i = L - 1; i >= 0; i--) {
    var isGrp = (i === 4);
    var grpCls = isGrp ? ' grp' : '';
    h += '<th class="' + grpCls + '">' + UNIT_NAMES[i] + '</th>';
    var isPl = !!placed[i];
    var d = s.charAt(L - 1 - i);
    var cls = (isPl ? 'filled' : 'empty') + grpCls;
    b += '<td class="' + cls + '" id="ec_' + i + '" data-ex-pos="' + i + '" onclick="onCellClick(' + i + ')">'
       + (isPl ? d : '?') + '</td>';
  }
  document.getElementById('exBoard').innerHTML = h + '</tr>' + b + '</tr>';
}

function onCellClick(pos) {
  if (!placed[pos]) {
    placeDigit(pos);
  }
}

function drawParts() {
  var s = String(curN), L = s.length, html = '';
  var allPlaced = true, anyPlaced = false;

  for (var i = 0; i < L; i++) {
    var d = +s.charAt(i), pos = L - 1 - i;
    if (!placed[pos]) { allPlaced = false; continue; }
    anyPlaced = true;
    if (d === 0) continue; // 0 的位不生成非零卡片
    var val = d * Math.pow(10, pos);
    html += '<div class="part' + (off[pos] ? ' off' : '') + '" data-p="' + pos + '">'
          + '<b>' + d + '</b> 個 ' + UNIT[pos]
          + '<span style="font-size:15px;color:#7c3aed">＝' + val + '</span></div>';
  }

  document.getElementById('eParts').innerHTML =
    html || '<div style="color:#94a3b8;font-size:16px;padding:12px 0;text-align:center">👇 請先把上方數字拉進定位板，位值積木就會在此展開 ✨</div>';

  [].forEach.call(document.querySelectorAll('.part'), function(el) {
    el.addEventListener('click', function() {
      var p = +el.getAttribute('data-p');
      off[p] = !off[p];
      drawParts();
    });
  });

  // 重算目前顯示值
  var v = 0;
  for (var j = 0; j < L; j++) {
    var dd = +s.charAt(j), pp = L - 1 - j;
    if (dd === 0 || off[pp] || !placed[pp]) continue;
    v += dd * Math.pow(10, pp);
  }
  document.getElementById('eNum').innerHTML = formatGroupedNumber(anyPlaced ? v : curN);

  var anyOff = Object.keys(off).some(function(k){ return off[k]; });
  var hintEl = document.getElementById('eHint');
  if (anyOff) {
    hintEl.innerHTML = '拿掉了幾塊，數字變成 <b>' + v + '</b>。<b>被拿掉的位要補 0</b>，不能整個消失！';
  } else if (allPlaced) {
    hintEl.innerHTML = '🎉 <b>太棒了！所有數字已放進定位板！</b><br>點一下任一塊，可以把它<b>拿掉</b>看看數字會變成多少 —— 這就是「分解」與「合成」。';
  } else {
    hintEl.innerHTML = '👉 請將上方數字<b>拉進</b>（或<b>點一下</b>）對應的定位板欄位，觀察每個數字的真正位值。';
  }
}

/* ═══ 練習 ═══ */
/* 題目全部取自課本活動一⑦～⑪與活動二⑥ */
var QS = [
  /* 0 分解：給數，答各位有幾個 */
  [
    {n:40980, ask:[4,3,2,1,0]},
    {n:51957, ask:[4,3,2,1,0]},
    {n:12300, ask:[4,3,2,1,0]}
  ],
  /* 1 位值辨識：某個數字在某位表示多少 */
  [
    {n:51957, d:5, which:'左邊那個', a:'50000'},
    {n:51957, d:5, which:'右邊那個', a:'50'},
    {n:27724, d:7, which:'右邊那個', a:'700'},
    {n:2340, d:2, which:'唯一那個', a:'2000'}
  ],
  /* 2 合成：照位序給 */
  [
    {parts:[[1,4],[7,3],[2,2],[6,1],[4,0]], a:'17264'},
    {parts:[[9,6],[4,5],[9,4],[9,2],[9,1],[5,0]], a:'9490995'}
  ],
  /* 3 合成（打亂順序） */
  [
    {parts:[[7,1],[5,3],[4,4]], a:'45070'},
    {parts:[[6,4],[3,6],[4,2],[5,0]], a:'3060405'}
  ],
  /* 4 合成（跳位）★ 缺的位要補 0 */
  [
    {parts:[[3,4],[8,3],[9,0]], a:'38009'},
    {parts:[[7,6],[8,3],[9,0]], a:'7008009'},
    {parts:[[6,5],[1,4],[9,3],[6,1]], a:'619060'},
    {parts:[[8,6],[3,4],[1,3],[5,0]], a:'8031005'}
  ]
];
var stage = 0, qi = 0, done = [0,0,0,0,0];
var solved = {}, advTimer = null, pendingMsg = '';
var qGen = 0;   // generation token：切關/切模式時遞增，使舊回呼失效


/* 所有練習區的延遲動作都走這裡。
   之前 setTimeout(renderQ, 700) 沒保存也沒取消，700ms 內切關就會
   用舊關卡的狀態重繪，把新關卡的答案清掉。 */
function schedule(fn, ms) {
  if (advTimer) { clearTimeout(advTimer); advTimer = null; }
  var gen = qGen;
  advTimer = setTimeout(function() {
    advTimer = null;
    if (gen !== qGen) return;        // 期間切過關/切過模式，這個回呼作廢
    fn();
  }, ms);
}

function cancelPending() {
  qGen++;                            // 讓所有在途回呼失效
  if (advTimer) { clearTimeout(advTimer); advTimer = null; }
}

function goStage(s) {
  hideScaffold();
  cancelPending();
  stage = s; qi = 0;
  for (var i = 0; i < 5; i++)
    document.getElementById('s' + i).className =
      'st' + (i === s ? ' on' : (done[i] ? ' done' : ''));
  renderQ();
}
function curQ() { return QS[stage][qi]; }

function partText(p) { return p[0] + ' 個 ' + UNIT[p[1]]; }

var qFilled = {};

function renderQ() {
  var q = curQ(), t = '', b = '', inp = '';
  qFilled = {};

  if (stage === 0) {
    t = '這個數可以分成幾個萬、幾個千、幾個百、幾個十和幾個一？';
    b = String(q.n);
    inp = '<div class="multi">';
    q.ask.forEach(function(p) {
      inp += '<span class="mi"><input id="i' + p + '" inputmode="numeric"> 個 ' + UNIT[p] + '</span>';
    });
    inp += '</div>';
  } else if (stage === 1) {
    t = '這個數裡的「' + q.d + '」表示多少？';
    b = String(q.n) + '　←　' + q.which + ' ' + q.d;
    inp = '<input class="ans" id="iA" inputmode="numeric" autocomplete="off">';
  } else {
    // 關卡三、四、五（合成題）：先放入定位板，再寫出數字
    t = stage === 4
      ? '先放進定位板，再寫出合起來的數字（★ 沒說到的位要補 0）'
      : '先放進定位板，再寫出合起來的數字';
    b = q.parts.map(partText).join('、') + '，合起來是多少？';

    // 1. 題目卡片
    var chipsHtml = '<div class="qchips" id="qChips">';
    q.parts.forEach(function(p, idx) {
      chipsHtml += '<div class="qchip" id="qc_' + idx + '" data-idx="' + idx + '" data-pos="' + p[1] + '" data-d="' + p[0] + '" onclick="clickQChip(' + idx + ')">'
                 + p[0] + ' 個 ' + UNIT[p[1]] + '</div>';
    });
    chipsHtml += '</div>';

    // 2. 定位板
    var maxPos = 0;
    q.parts.forEach(function(p){ if (p[1] > maxPos) maxPos = p[1]; });
    var h = '<tr>', row = '<tr>';
    for (var i = maxPos; i >= 0; i--) {
      h += '<th>' + UNIT[i] + '</th>';
      row += '<td class="empty" id="qtd_' + i + '" data-qpos="' + i + '" onclick="clickQCell(' + i + ')">?</td>';
    }
    var boardHtml = '<div style="font-size:15px;font-weight:700;color:#059669;text-align:center;margin:6px 0 4px">① 先放進定位板（點卡片或點格子填入）：</div>'
                  + '<div class="qboard-wrap"><table class="qboard" id="qBoard">'
                  + h + '</tr>' + row + '</tr></table></div>';

    var msgHtml = '<div id="qBoardMsg" style="font-size:14px;color:#64748b;text-align:center;min-height:20px;margin-bottom:8px"></div>';

    var ansHtml = '<div style="font-size:15px;font-weight:700;color:#475569;text-align:center;margin:10px 0 6px">② 合起來的數字是：</div>'
                + '<input class="ans" id="iA" inputmode="numeric" placeholder="填寫或由定位板完成數字" autocomplete="off">';

    inp = chipsHtml + boardHtml + msgHtml + ansHtml;
  }
  document.getElementById('qTitle').textContent =
    '關卡' + '一二三四五'.charAt(stage) + '　' + t;
  document.getElementById('qBody').textContent = b;
  document.getElementById('qInput').innerHTML = inp;
  var _fb = document.getElementById('qFb');
  if (pendingMsg) { _fb.innerHTML = pendingMsg; _fb.className = 'fb no'; pendingMsg = ''; }
  else { _fb.textContent = ''; _fb.className = 'fb'; }
  document.getElementById('qProg').textContent =
    '第 ' + (qi + 1) + ' 題，共 ' + QS[stage].length + ' 題';
  var a = document.getElementById('iA');
  if (a) a.addEventListener('keydown', function(e){ if (e.key === 'Enter') checkAns(); });
}

function clickQChip(idx) {
  var q = curQ();
  if (!q || !q.parts || !q.parts[idx]) return;
  var p = q.parts[idx];
  fillQPos(p[1], p[0]);
}

function clickQCell(pos) {
  var q = curQ();
  if (!q || !q.parts) return;
  var hit = null;
  q.parts.forEach(function(p){ if (p[1] === pos) hit = p[0]; });
  var msg = document.getElementById('qBoardMsg');
  if (hit !== null) {
    fillQPos(pos, hit);
    if (msg) msg.innerHTML = '<span style="color:#059669">已填入 <b>' + hit + ' 個' + UNIT[pos] + '</b></span>';
  } else {
    fillQPos(pos, 0);
    if (msg) msg.innerHTML = '題目<b>沒有提到</b>' + UNIT[pos] + '，所以這一格填 <b style="color:#dc2626">0</b>！';
  }
}

function fillQPos(pos, val) {
  qFilled[pos] = val;
  var td = document.getElementById('qtd_' + pos);
  if (td) {
    td.textContent = val;
    td.className = (val === 0) ? 'zero' : 'filled';
    td.classList.add('drop');
    setTimeout(function(){ if (td) td.classList.remove('drop'); }, 300);
  }

  var q = curQ();
  if (q && q.parts) {
    q.parts.forEach(function(p, idx) {
      var qc = document.getElementById('qc_' + idx);
      if (qc) {
        if (qFilled[p[1]] !== undefined) qc.classList.add('placed');
        else qc.classList.remove('placed');
      }
    });
  }

  var maxPos = 0;
  q.parts.forEach(function(p){ if (p[1] > maxPos) maxPos = p[1]; });
  var allFilled = true, ansStr = '';
  for (var i = maxPos; i >= 0; i--) {
    if (qFilled[i] === undefined) { allFilled = false; break; }
    ansStr += String(qFilled[i]);
  }

  if (allFilled) {
    var aInput = document.getElementById('iA');
    if (aInput) {
      aInput.value = ansStr;
      aInput.focus();
    }
    var msg = document.getElementById('qBoardMsg');
    if (msg) msg.innerHTML = '🎉 <b style="color:#059669">定位板填寫完成！合起來是 ' + ansStr + '，請點「確認」檢查答案。</b>';
  }
}

function checkAns() {
  var q = curQ(), fb = document.getElementById('qFb'), ok, want;
  if (stage === 0) {
    var s = String(q.n), L = s.length; ok = true; want = [];
    q.ask.forEach(function(p) {
      var d = (p < L) ? +s.charAt(L - 1 - p) : 0;
      want.push(d + ' 個 ' + UNIT[p]);
      var el = document.getElementById('i' + p);
      if (!el || el.value.trim() !== String(d)) ok = false;
    });
    want = want.join('、');
  } else {
    var got = (document.getElementById('iA').value || '').replace(/[\s,，]/g, '');
    want = q.a; ok = got === want;
  }
  if (ok) {
    fb.className = 'fb ok'; fb.textContent = '✅ 答對了！';
    solved[stage + '_' + qi] = true;
    hideScaffold();
  } else {
    fb.className = 'fb no';
    // 合成題（關卡三四五）答錯 → 換成定位板的形式重呈同一題
    if (stage >= 2) {
      fb.innerHTML = '❌ 先別急著看答案 —— 我們回到定位板上放放看';
      showScaffold(q);
    } else {
      fb.innerHTML = '❌ 再想想　正確答案：<b>' + want + '</b>';
    }
  }
}

/* ═══ 表徵重呈：把同一題換成定位板的形式再呈現一次 ═══
   注意這**不是適性鷹架** —— 它沒有讀取學生的答案（contingency）、
   沒有分層淡出（fading）、也沒有撤掉協助後的確認（責任移轉）。
   三個特徵都沒有，所以本專案一律稱它為「表徵重呈」。
   詳見 ../docs/互動教具設計流程.md 的〈核心原則〉1-B。 */
var scafQ = null, scafFilled = {};

function showScaffold(q) {   // 名稱沿用，實為表徵重呈
  scafQ = q; scafFilled = {};
  document.getElementById('scSub').innerHTML =
    '題目說：<b>' + q.parts.map(partText).join('、') + '</b><br>'
    + '點一下對應的格子把它放進去。放完看看 <b>空著的格子該填什麼</b>。';
  drawScaffold();
  document.getElementById('scaf').className = 'scaffold on';
  document.getElementById('scMsg').textContent = '';
}

function hideScaffold() {
  document.getElementById('scaf').className = 'scaffold';
  scafQ = null;
}

function drawScaffold() {
  if (!scafQ) return;
  var maxPos = 0;
  scafQ.parts.forEach(function(p){ if (p[1] > maxPos) maxPos = p[1]; });
  var h = '<tr>', b = '<tr>';
  for (var i = maxPos; i >= 0; i--) {
    h += '<th>' + UNIT[i] + '</th>';
    var v = scafFilled[i];
    var cls = (v === undefined) ? 'empty' : 'filled';
    b += '<td class="' + cls + '" data-p="' + i + '">'
       + (v === undefined ? '?' : v) + '</td>';
  }
  document.getElementById('scTbl').innerHTML = h + '</tr>' + b + '</tr>';
  [].forEach.call(document.querySelectorAll('#scTbl td'), function(el) {
    el.addEventListener('click', function(){ tapScaffold(+el.getAttribute('data-p')); });
  });
}

function tapScaffold(pos) {
  if (!scafQ) return;
  var msg = document.getElementById('scMsg');
  var hit = null;
  scafQ.parts.forEach(function(p){ if (p[1] === pos) hit = p[0]; });
  if (hit !== null) {
    scafFilled[pos] = hit;
    msg.innerHTML = '放進 <b>' + hit + ' 個' + UNIT[pos] + '</b> 了';
  } else {
    // 題目沒提到這一位 —— 這正是跳位題的關鍵
    scafFilled[pos] = 0;
    msg.innerHTML = '題目<b>沒有提到</b>' + UNIT[pos]
      + '，所以這一格要放 <b style="color:#dc2626">0</b>，不能空著！';
  }
  drawScaffold();
  // 全部填滿就把答案顯示出來
  var maxPos = 0;
  scafQ.parts.forEach(function(p){ if (p[1] > maxPos) maxPos = p[1]; });
  var done = true;
  for (var i = 0; i <= maxPos; i++) if (scafFilled[i] === undefined) done = false;
  if (done) {
    var s = '';
    for (var j = maxPos; j >= 0; j--) s += scafFilled[j];
    msg.innerHTML = '每一格都放好了 → <b style="font-size:24px">' + s + '</b>';
  }
}

function scaffoldDone() {
  hideScaffold();
  var fb = document.getElementById('qFb');
  fb.className = 'fb';
  fb.textContent = '再答一次看看 👇';
  var a = document.getElementById('iA');
  if (a) { a.value = ''; a.focus(); }
}

function nextQ() {
  hideScaffold();
  if (qi < QS[stage].length - 1) { qi++; renderQ(); return; }
  var all = QS[stage].every(function(_, k){ return solved[stage + '_' + k]; });
  var fb = document.getElementById('qFb');
  if (!all) {
    var n = QS[stage].filter(function(_, k){ return !solved[stage + '_' + k]; }).length;
    fb.className = 'fb no';
    pendingMsg = '還有 <b>' + n + '</b> 題沒答對 —— 已跳回第一題還沒答對的';
    fb.innerHTML = pendingMsg;
    qi = QS[stage].findIndex(function(_, k){ return !solved[stage + '_' + k]; });
    schedule(renderQ, 700);
    return;
  }
  done[stage] = 1;
  fb.className = 'fb ok';
  fb.innerHTML = '🎉 關卡' + '一二三四五'.charAt(stage) + '完成！';
  if (stage < 4) {
    var target = stage + 1;
    schedule(function(){ goStage(target); }, 900);
  } else {
    document.getElementById('s4').className = 'st done';
  }
}

setSample(40980, true);
goStage(0);

/* ═══ 挑戰：學力檢測考古題（N-4-1）═══ */
var CH_I = 0, CH_DONE = false;

function renderChal() {
  var q = CHAL[CH_I];
  CH_DONE = false;
  document.getElementById('chSrc').textContent =
    q.y + ' 年 國小學力檢測 四年級 第 ' + q.n + ' 題';
  document.getElementById('chStem').textContent = q.stem;
  var h = '';
  q.opts.forEach(function(o, i) {
    h += '<button class="chopt" data-i="' + (i + 1) + '">' +
         '\u2460\u2461\u2462\u2463'.charAt(i) + '　' + o + '</button>';
  });
  document.getElementById('chOpts').innerHTML = h;
  [].forEach.call(document.querySelectorAll('.chopt'), function(el) {
    el.addEventListener('click', function(){ pickChal(+el.getAttribute('data-i')); });
  });
  document.getElementById('chNote').innerHTML = q.note
    ? '\u26a0\ufe0f ' + q.note : '';
  document.getElementById('chNote').style.display = q.note ? 'block' : 'none';
  var w = document.getElementById('chWhy');
  w.style.display = 'none'; w.textContent = '';
  document.getElementById('chFb').textContent = '';
  document.getElementById('chFb').className = 'fb';
  document.getElementById('chProg').textContent =
    '第 ' + (CH_I + 1) + ' 題，共 ' + CHAL.length + ' 題';
}

function pickChal(i) {
  if (CH_DONE) return;
  CH_DONE = true;
  var q = CHAL[CH_I], fb = document.getElementById('chFb');
  [].forEach.call(document.querySelectorAll('.chopt'), function(el) {
    var k = +el.getAttribute('data-i');
    if (k === q.a) el.className = 'chopt ok';
    else if (k === i) el.className = 'chopt no';
  });
  fb.className = 'fb ' + (i === q.a ? 'ok' : 'no');
  fb.textContent = i === q.a ? '\u2705 答對了！' : '\u274c 正確答案是 ' +
    '\u2460\u2461\u2462\u2463'.charAt(q.a - 1);
  var w = document.getElementById('chWhy');
  w.textContent = '\u{1F4A1} ' + q.why;
  w.style.display = 'block';
}

function nextChal() { CH_I = (CH_I + 1) % CHAL.length; renderChal(); }
